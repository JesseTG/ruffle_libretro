[package]
name = "ruffle_libretro"
version = "0.7.1"
edition = "2021"
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
futures = "0.3.32"
libc = "0.2"
log = "0.4"
# Profiling macros compile to nothing unless the `profiler` feature picks a backend.
profiling = { version = "1.0", default-features = false }
ruffle_core = { git = "https://github.com/ruffle-rs/ruffle", tag = "v0.7.1", features = ["audio", "lzma", "mp3", "aac", "nellymoser", "default_compatibility_rules", "default_font"] }
ruffle_frontend_utils = { git = "https://github.com/ruffle-rs/ruffle", tag = "v0.7.1", features = ["fs", "navigator"] }
ruffle_render = { git = "https://github.com/ruffle-rs/ruffle", tag = "v0.7.1" }
ruffle_render_wgpu = { git = "https://github.com/ruffle-rs/ruffle", tag = "v0.7.1" }
ruffle_video_software = { git = "https://github.com/ruffle-rs/ruffle", tag = "v0.7.1" }
rust-libretro = { git = "https://github.com/max-m/rust-libretro", rev = "ac04a98", features = ["unstable-env-commands", "strict-bitflags", "log"] }
rust-libretro-sys = { git = "https://github.com/max-m/rust-libretro", rev = "ac04a98" }
thiserror = "2.0"
tokio = { version = "1.52", features = ["rt-multi-thread"] }
# Forward Ruffle's `tracing` events to `log`, which rust-libretro sends to the frontend.
tracing = { version = "0.1", features = ["log"] }
url = "2.5"
webbrowser = "1.0"

[features]
default = []
profiler = ["profiling/profile-with-tracy", "ruffle_render_wgpu/profile-with-tracy"]

[profile.dev]
opt-level = 1

[profile.release]
lto = true

[profile.dev.package.h263-rs]
opt-level = 3

[profile.dev.package.h263-rs-yuv]
opt-level = 3

[profile.dev.package.nihav_core]
opt-level = 3

[profile.dev.package.nihav_codec_support]
opt-level = 3

[profile.dev.package.nihav_duck]
opt-level = 3

[build-dependencies]
built = "0.8"
